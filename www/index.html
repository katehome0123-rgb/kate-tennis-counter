<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ソフトテニス 得点板</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Arial Black', Impact, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 10px;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            padding-left: max(10px, env(safe-area-inset-left));
            padding-right: max(10px, env(safe-area-inset-right));
            height: 100vh;      /* 古いブラウザ用フォールバック */
            height: 100dvh;     /* スマホのアドレスバー増減に追従する高さ */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 得点板コンテナ */
        .scoreboard {
            flex: 1;
            min-height: 0; /* flexの子要素がはみ出して下のボタンを押し出さないようにする */
            background-color: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 15px;
            position: relative;
            border: 2px solid #333;
        }

        /* チーム名/プレイヤー名表示エリア */
        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        /* 手入力可能な名前インプット */
        .player-name-input {
            font-family: sans-serif;
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 8px;
            height: 36px;
            line-height: 36px;
            letter-spacing: 1px;
            background: transparent;
            border: none;
            border-bottom: 1px dashed #555;
            text-align: center;
            width: 90%;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .player-name-input:focus {
            border-bottom: 2px solid #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* 名前ごとの色指定 */
        .player-left {
            color: #ff3b30;
        }
        .player-right {
            color: #007aff;
        }

        /* 空白保持用のダミーエリア */
        .name-spacer {
            height: 36px;
            margin-bottom: 8px;
        }

        /* 各スコアパネル（カード部分） */
        .card {
            background-color: #000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1), 0 5px 15px rgba(0,0,0,0.8);
            border: 2px solid #222;
            position: relative;
            cursor: pointer;
            width: 100%;
        }
        .card:active {
            transform: scale(0.98);
        }

        /* リングの演出 */
        .card::before, .card::after {
            content: '';
            position: absolute;
            top: -12px;
            width: 12px;
            height: 24px;
            border: 4px solid #777;
            border-radius: 6px;
            background-color: #222;
            z-index: 10;
        }
        .card::before { left: 20%; }
        .card::after { right: 20%; }

        /* ポイントカード（大） */
        .point-wrapper {
            flex: 3;
            justify-content: flex-end;
        }
        .point-card {
            height: 100%;
        }
        .point-card .number {
            font-size: 34vh;
            font-size: 34dvh;
            line-height: 1;
            font-weight: 900;
            -webkit-text-stroke: 8px #ffffff;
            paint-order: stroke fill;
        }

        /* ゲーム数カード（小） */
        .game-wrapper {
            flex: 2;
            justify-content: flex-end;
        }
        .game-card {
            height: 75%;
        }
        .game-card .number {
            font-size: 24vh;
            font-size: 24dvh;
            line-height: 1;
            font-weight: 900;
            -webkit-text-stroke: 6px #ffffff;
            paint-order: stroke fill;
        }

        /* カラー指定：左（赤）・右（青） */
        .team-left {
            color: #ff3b30;
            text-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
        }
        .team-right {
            color: #007aff;
            text-shadow: 0 0 15px rgba(0, 122, 255, 0.4);
        }

        /* 中央の仕切りとKATEロゴ */
        .center-divider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: space-between;
        }
        .brand-logo-top {
            font-family: sans-serif;
            font-weight: 900;
            font-size: 28px;
            color: #988780;
            margin-bottom: 8px;
            height: 36px;
            line-height: 36px;
            letter-spacing: 2px;
        }
        .center-divider {
            width: 4px;
            height: 60%;
            background-color: #333;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        /* コントロールバー（下部） */
        .controls {
            display: flex;
            flex-shrink: 0; /* 常に表示領域を確保し、押し出されて消えないようにする */
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            gap: 10px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            font-family: sans-serif;
            font-weight: bold;
            background-color: #2c2c2e;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        button:active {
            background-color: #444;
        }
        .btn-reset {
            background-color: #3a1c1c;
            color: #ff6b6b;
        }
        .match-info {
            color: #8e8e93;
            font-family: sans-serif;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="scoreboard">
    <!-- 左チーム (赤) ポイントカード -->
    <div class="card-wrapper point-wrapper">
        <div class="name-spacer"></div>
        <div class="card point-card team-left" onclick="addPoint('A')">
            <div class="number" id="pointA">0</div>
        </div>
    </div>

    <!-- 左チーム (赤) ゲーム数カード＋手入力名前 -->
    <div class="card-wrapper game-wrapper">
        <input type="text" class="player-name-input player-left" id="nameA" value="新田">
        <div class="card game-card team-left" onclick="addGame('A')">
            <div class="number" id="gameA">0</div>
        </div>
    </div>

    <!-- 中央仕切り ＆ KATE -->
    <div class="center-divider-container">
        <div class="brand-logo-top">KATE</div>
        <div class="center-divider"></div>
    </div>

    <!-- 右チーム (青) ゲーム数カード＋手入力名前（相手チーム） -->
    <div class="card-wrapper game-wrapper">
        <input type="text" class="player-name-input player-right" id="nameB" value="相手チーム">
        <div class="card game-card team-right" onclick="addGame('B')">
            <div class="number" id="gameB">0</div>
        </div>
    </div>

    <!-- 右チーム (青) ポイントカード -->
    <div class="card-wrapper point-wrapper">
        <div class="name-spacer"></div>
        <div class="card point-card team-right" onclick="addPoint('B')">
            <div class="number" id="pointB">0</div>
        </div>
    </div>
</div>

<div class="controls">
    <div class="btn-group">
        <button onclick="subPoint('A')">左 Pt -1</button>
        <button onclick="subGame('A')">左 G -1</button>
    </div>
    
    <div class="match-info" id="matchStatus">5ゲームマッチ</div>

    <div class="btn-group">
        <button onclick="changeMatchLength()">マッチ数切替</button>
        <button class="btn-reset" onclick="resetAll()">リセット</button>
        <button onclick="subGame('B')">右 G -1</button>
        <button onclick="subPoint('B')">右 Pt -1</button>
    </div>
</div>

<script>
    let pointA = 0, pointB = 0;
    let gameA = 0, gameB = 0;
    let totalGames = 5;
    let winsNeeded = 3;
    let isGameOver = false;

    function updateDisplay() {
        document.getElementById('pointA').innerText = pointA;
        document.getElementById('pointB').innerText = pointB;
        document.getElementById('gameA').innerText = gameA;
        document.getElementById('gameB').innerText = gameB;
        
        const isFinal = (gameA === winsNeeded - 1 && gameB === winsNeeded - 1);
        let statusText = `${totalGames}ゲームマッチ (${winsNeeded}先取)`;
        if (isFinal) {
            statusText += " 【ファイナルゲーム】";
        }
        document.getElementById('matchStatus').innerText = statusText;
    }

    function addPoint(team) {
        if (isGameOver) return;

        if (team === 'A') pointA++;
        else pointB++;

        checkGameWin();
        updateDisplay();
    }

    function checkGameWin() {
        const isFinalGame = (gameA === winsNeeded - 1 && gameB === winsNeeded - 1);
        const winPoints = isFinalGame ? 7 : 4;

        if (pointA >= winPoints && (pointA - pointB) >= 2) {
            gameA++;
            pointA = 0;
            pointB = 0;
            checkMatchWin();
        } else if (pointB >= winPoints && (pointB - pointA) >= 2) {
            gameB++;
            pointA = 0;
            pointB = 0;
            checkMatchWin();
        }
    }

    function checkMatchWin() {
        const nameA = document.getElementById('nameA').value || '赤（左）';
        const nameB = document.getElementById('nameB').value || '青（右）';

        if (gameA === winsNeeded) {
            isGameOver = true;
            setTimeout(() => alert(`${nameA}の勝利です！`), 50);
        } else if (gameB === winsNeeded) {
            isGameOver = true;
            setTimeout(() => alert(`${nameB}の勝利です！`), 50);
        }
    }

    function subPoint(team) {
        if (team === 'A' && pointA > 0) pointA--;
        if (team === 'B' && pointB > 0) pointB--;
        updateDisplay();
    }

    function addGame(team) {
        if (isGameOver) return;
        if (team === 'A') gameA++;
        else gameB++;
        checkMatchWin();
        updateDisplay();
    }

    function subGame(team) {
        if (team === 'A' && gameA > 0) gameA--;
        if (team === 'B' && gameB > 0) gameB--;
        isGameOver = false;
        updateDisplay();
    }

    function changeMatchLength() {
        if (totalGames === 5) totalGames = 7;
        else if (totalGames === 7) totalGames = 3;
        else totalGames = 5;
        winsNeeded = Math.ceil(totalGames / 2);
        resetAll(false);
    }

    function resetAll(askConfirm = true) {
        if (!askConfirm || confirm("カウントをリセットしますか？")) {
            pointA = 0; pointB = 0;
            gameA = 0; gameB = 0;
            isGameOver = false;
            updateDisplay();
        }
    }

    updateDisplay();
</script>

</body>
</html>
